# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: dbc-186723c8-e7c1.cloud.databricks.com
      root_path: /Workspace/Users/sunilprakashb@gmail.com/Databricks Bootcamp/DEV/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: db_bootcamp
      schema: dev
    permissions:
      - group_name: admins
        level: CAN_MANAGE
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false

    
  prod:
    mode: production
    workspace:
      host: dbc-186723c8-e7c1.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sunilprakashb@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sunilprakashb@gmail.com/Databricks Bootcamp/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: db_bootcamp
      schema: prod
    permissions:
      - user_name: sunilprakashb@gmail.com
        level: CAN_MANAGE
      - group_name: admins
        level: CAN_RUN
